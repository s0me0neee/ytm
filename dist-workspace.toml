[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# `release.yml` is hand-edited after generation and dist must neither check it
# nor rewrite it. The edit is one Windows-only step, described at the foot of
# this file; re-running `dist generate` drops it, so it has to go back after.
allow-dirty = ["ci"]

# Extra CI steps, spliced into the build job ahead of `dist build`. Two things
# have to happen there that no package manager can do:
#
#   * the GUI's frontend has to be *built*, because `frontendDist` is what
#     `tauri::generate_context!()` embeds at compile time. `beforeBuildCommand`
#     in `tauri.conf.json` is run by the tauri CLI, and dist builds with plain
#     cargo — so without this step `ytm-gui` compiles against an empty `dist/`.
#   * Windows has no libmpv to install. See `.github/build-setup.yml`.
#
# It lives beside the workflows rather than in them: anything under
# `.github/workflows/` is parsed by GitHub as a workflow of its own, and a bare
# list of steps is not one — it would show up in the Actions tab as an invalid
# workflow file forever.
github-build-setup = "../build-setup.yml"

# libmpv is linked, so the *library* has to be present on every builder, and
# the GUI adds WebKitGTK on top of it — `ytm-gui` is Tauri, whose Linux backend
# is webkit2gtk-4.1 (the 4.0 in jammy's base is Tauri 1's and will not do).
# Windows takes neither of these; it is handled in `build-setup.yml`.
[dist.dependencies.apt]
libmpv-dev = '*'
"libwebkit2gtk-4.1-dev" = '*'
libgtk-3-dev = '*'
libayatana-appindicator3-dev = '*'
librsvg2-dev = '*'
libxdo-dev = '*'
libssl-dev = '*'
build-essential = '*'
file = '*'

[dist.dependencies.homebrew]
mpv = '*'

# The Windows zip ships `libmpv-2.dll` beside `ytm.exe`, because without it the
# binary exits with a bare `STATUS_DLL_NOT_FOUND` and no message — libmpv is
# linked, and there is no package that would put it on a user's machine.
#
# dist cannot express that. `include` is per-workspace, so the same 120MB DLL
# would go into both macOS tarballs, both Linux tarballs and both npm packages;
# and a path that exists only on the Windows runner is a hard error rather than
# a skip ("failed to copy asset ... No such file or directory"). So the zip is
# repacked after `dist build` instead, by a step hand-added to `release.yml` —
# which is what `allow-dirty` above is for. Repacking there is safe because the
# manifest names the checksum *file* rather than the hash it holds, so writing
# that file again alongside is the whole of what consistency requires.
