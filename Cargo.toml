[workspace]
resolver = "3"
members = ["lrclib", "ytm-core", "tui", "gui/src-tauri"]

# Cross-crate inlining is worth more here than usual: the hot paths run in
# `ytm-core` but are *called* from `tui`/`gui`, so without LTO every tick pays
# a real call into another crate. `codegen-units = 1` costs build time and
# nothing else. `strip` is purely resident-size -- debug symbols in a shipped
# binary are pages the OS still has to map.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# The profile that 'dist' will build with. Inherits `release` and overrides
# nothing: it used to drop back to `lto = "thin"`, which meant the one profile
# that actually ships was the one *not* getting the cross-crate inlining the
# comment above is about. Thin is the right default for a profile you build
# often; this one is built once per release, so the extra link time is free.
[profile.dist]
inherits = "release"


[workspace.lints.clippy]
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
